plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nolate.alarm'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace 'expo.modules.nolatealarm'

  defaultConfig {
    minSdk 24
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // Runtime copies are already supplied by the host's pinned RNFirebase dependency. Compile-only
  // keeps this local module from introducing a second Firebase version while retaining inherited
  // onNewToken/onSendError callbacks in NoLateFirebaseMessagingService.
  compileOnly project(':react-native-firebase_messaging')
  compileOnly platform('com.google.firebase:firebase-bom:34.14.0')
  compileOnly 'com.google.firebase:firebase-messaging'
  testImplementation 'junit:junit:4.13.2'
}
