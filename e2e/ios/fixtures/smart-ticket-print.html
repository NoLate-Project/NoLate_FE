<title>NoLate 합성 승차권</title>
<style>

  body { margin: 18px; font: 16px -apple-system, sans-serif; color: #111; }

  header, footer { display: flex; justify-content: space-between; align-items: center; padding: 16px; }
  header { border-bottom: 2px solid #215a93; }

  strong { display: block; font-size: 30px; }
  time { display: block; margin-top: 8px; font-size: 23px; }

  @page { size: A5; margin: 12mm; }
</style>
<main>
  <p>테스트용 승차권</p>
  <header><span>2026년11월12일(목)</span><span>스마트티켓 1매</span></header>
  <section><div><strong>서울</strong><time>06:43</time></div><div><strong>동대구</strong><time>08:32</time></div></section>
